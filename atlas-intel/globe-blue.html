<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Intelligence Globe Viewer</title>
    <style>
        :root {
            --color-primary: #2563eb;
            --color-dark: #1e293b;
            --color-secondary: #64748b;
            --color-light: #f1f5f9;
            --color-white: #ffffff;
            --color-border: rgba(148, 163, 184, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #globe {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .panel {
            position: absolute;
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .header-panel {
            top: 20px;
            left: 20px;
            max-width: 400px;
        }

        .header-panel h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--color-primary);
            font-weight: 600;
        }

        .header-panel p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(102, 126, 234, 0.15);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            background: rgba(102, 126, 234, 0.25);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .info-panel {
            top: 20px;
            right: 20px;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }

        .info-panel.visible {
            display: block;
        }

        .country-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .country-flag {
            font-size: 48px;
        }

        .country-name {
            flex: 1;
        }

        .country-name h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: white;
            font-weight: 600;
        }

        .country-code {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .section:first-of-type {
            border-top: none;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 16px;
            align-items: flex-start;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-row.vertical {
            flex-direction: column;
            gap: 6px;
        }

        .data-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            flex-shrink: 0;
            min-width: 100px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .data-value {
            font-weight: 400;
            font-size: 13px;
            line-height: 1.6;
            text-align: right;
            flex: 1;
            color: white;
        }

        .data-row.vertical .data-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .data-row.vertical .data-value {
            text-align: left;
            opacity: 0.9;
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .region-chip {
            background: rgba(102, 126, 234, 0.1);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .airports-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .airport-chip {
            background: rgba(118, 75, 162, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }

        .controls-panel {
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(102, 126, 234, 0.2);
            backdrop-filter: blur(10px) saturate(150%);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(102, 126, 234, 0.4);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.6);
        }

        .control-btn.active {
            background: rgba(102, 126, 234, 0.4);
            border-color: #667eea;
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .legend {
            bottom: 20px;
            right: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            min-width: 320px;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease-out;
            z-index: 100;
        }

        .loading.transparent {
            background: rgba(15, 12, 41, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 14px;
            line-height: 1.6;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="globe"></canvas>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Initializing globe viewer...</div>
        </div>

        <div class="panel header-panel">
            <h1>🌍 Location Intelligence Globe</h1>
            <p>Interactive 3D visualization of all geographic data</p>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="countryCount">0</div>
                    <div class="stat-label">COUNTRIES</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="airportCount">0</div>
                    <div class="stat-label">AIRPORTS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="regionCount">0</div>
                    <div class="stat-label">REGIONS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="populationCount">0</div>
                    <div class="stat-label">TOTAL POPULATION</div>
                </div>
            </div>
        </div>

        <div class="panel info-panel" id="infoPanel">
            <!-- Country info will be inserted here -->
        </div>

        <div class="panel controls-panel">
            <button class="control-btn active" id="toggleBoundaries" onclick="toggleBoundaries()">
                🗺️ Boundaries
            </button>
            <button class="control-btn active" id="toggleAirports" onclick="toggleAirports()">
                ✈️ Airports (7.8K)
            </button>
            <button class="control-btn" id="loadAllAirports" onclick="loadAllAirports()">
                ✈️ +21K Airports
            </button>
            <button class="control-btn" id="toggleRotation" onclick="toggleRotation()">
                🔄 Auto-Rotate
            </button>
        </div>

        <div class="panel legend">
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(0, 255, 255, 0.95); height: 3px; margin: 8px 0;"></div>
                <span>Country Boundary</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(255, 170, 0, 1.0); width: 8px; height: 8px; border-radius: 50%;"></div>
                <span>Commercial Airport</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(136, 136, 136, 0.4); width: 8px; height: 8px; border-radius: 50%;"></div>
                <span>Other Airport</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(255, 0, 255, 1.0); width: 9px; height: 9px; border-radius: 50%;"></div>
                <span>Capital City</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
    <script src="globe-blue.js?v=blue-8a5f272"></script>
</body>
</html>
