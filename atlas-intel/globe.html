<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Intelligence Globe Viewer</title>
    <style>
        :root {
            --color-ink: #141413;
            --color-muted: #5e5d59;
            --color-paper: #e8e6dc;
            --color-paper-light: #faf9f5;
            --color-paper-mid: #f0eee6;
            --color-border: rgba(20, 20, 19, 0.14);
            --color-clay: #d97757;
            --color-blue: #6396d6;
            --color-green: #6ea100;
            --ui-edge: clamp(12px, 2vw, 24px);
            --controls-reserve: 76px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--color-paper);
            color: var(--color-ink);
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            min-width: 0;
            min-height: 0;
        }

        #globe {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: grab;
            touch-action: none;
        }

        #globe.is-dragging {
            cursor: grabbing;
        }

        .panel {
            position: fixed;
            border-radius: 8px;
            z-index: 10;
        }

        .header-panel {
            top: var(--ui-edge);
            left: var(--ui-edge);
            max-width: min(460px, calc(100dvw - (var(--ui-edge) * 2)));
            max-height: calc(100dvh - (var(--ui-edge) * 2) - var(--controls-reserve));
            overflow: hidden;
            pointer-events: none;
        }

        .header-panel h1 {
            font-size: clamp(28px, 5vw, 56px);
            line-height: 0.95;
            margin-bottom: 12px;
            color: var(--color-ink);
            font-weight: 650;
            letter-spacing: 0;
        }

        .header-panel p {
            max-width: 360px;
            font-size: 14px;
            line-height: 1.45;
            color: var(--color-muted);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
            max-width: min(460px, calc(100dvw - (var(--ui-edge) * 2)));
        }

        .stat-card {
            background: rgba(250, 249, 245, 0.76);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            display: flex;
            align-items: baseline;
            gap: 7px;
            padding: 7px 10px;
            min-width: 0;
            max-width: 100%;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-ink);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .stat-label {
            font-size: 10px;
            color: var(--color-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            white-space: nowrap;
        }

        .info-panel {
            top: var(--ui-edge);
            right: var(--ui-edge);
            width: min(380px, calc(100dvw - (var(--ui-edge) * 2)));
            max-height: calc(100dvh - (var(--ui-edge) * 2));
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-gutter: stable;
            display: none;
            background: rgba(250, 249, 245, 0.94);
            border: 1px solid var(--color-border);
            box-shadow: 0 18px 60px rgba(20, 20, 19, 0.14);
            padding: 20px;
            z-index: 40;
        }

        .info-panel.visible {
            display: block;
        }

        .country-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .country-flag {
            font-size: 48px;
            width: 56px;
            min-width: 56px;
            min-height: 42px;
            display: grid;
            place-items: center;
            line-height: 1;
        }

        .country-flag-svg {
            width: 56px;
            max-height: 42px;
            display: block;
            object-fit: contain;
            border: 1px solid rgba(20, 20, 19, 0.12);
            box-shadow: 0 1px 4px rgba(20, 20, 19, 0.08);
        }

        .country-flag-code {
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 6px 8px;
            color: var(--color-muted);
            font-size: 14px;
            font-weight: 700;
        }

        .airport-mark {
            border: 1px solid var(--color-border);
            border-radius: 999px;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            color: var(--color-blue);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .country-name {
            flex: 1;
            min-width: 0;
        }

        .country-name h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: var(--color-ink);
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .country-code {
            font-size: 12px;
            color: var(--color-muted);
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .section:first-of-type {
            border-top: none;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-clay);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--color-border);
            gap: 16px;
            align-items: flex-start;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-row.vertical {
            flex-direction: column;
            gap: 6px;
        }

        .data-label {
            color: var(--color-muted);
            font-size: 12px;
            flex-shrink: 0;
            min-width: 100px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .data-value {
            font-weight: 400;
            font-size: 13px;
            line-height: 1.6;
            text-align: right;
            flex: 1;
            color: var(--color-ink);
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .data-row.vertical .data-label {
            color: var(--color-muted);
        }

        .data-row.vertical .data-value {
            text-align: left;
            opacity: 0.9;
        }

        .airports-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .airport-chip {
            background: var(--color-paper-mid);
            border: 1px solid var(--color-border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }

        .controls-panel {
            bottom: var(--ui-edge);
            left: var(--ui-edge);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: calc(100dvw - (var(--ui-edge) * 2));
            max-height: min(42dvh, 180px);
            overflow-y: auto;
            z-index: 30;
        }

        .control-btn {
            background: rgba(250, 249, 245, 0.84);
            border: 1px solid var(--color-border);
            color: var(--color-ink);
            padding: 9px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.03em;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .control-btn:hover {
            background: var(--color-paper-light);
            border-color: rgba(20, 20, 19, 0.32);
        }

        .control-btn.active {
            background: var(--color-ink);
            border-color: var(--color-ink);
            color: var(--color-paper-light);
        }

        .control-btn.icon-btn {
            min-width: 36px;
            padding: 9px 0;
            font-size: 16px;
            line-height: 1;
        }

        .legend {
            bottom: var(--ui-edge);
            right: var(--ui-edge);
            background: rgba(250, 249, 245, 0.78);
            border: 1px solid var(--color-border);
            padding: 10px 12px;
            max-width: calc(100dvw - (var(--ui-edge) * 2));
            max-height: calc(100dvh - (var(--ui-edge) * 2));
            overflow-y: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--color-muted);
        }

        body.info-open .legend {
            display: none;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: min(320px, calc(100dvw - (var(--ui-edge) * 2)));
            background: rgba(250, 249, 245, 0.96);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 18px 60px rgba(20, 20, 19, 0.14);
            border: 1px solid var(--color-border);
            transition: all 0.5s ease-out;
            z-index: 100;
        }

        .loading.transparent {
            background: rgba(250, 249, 245, 0.62);
        }

        .spinner {
            border: 2px solid rgba(20, 20, 19, 0.1);
            border-top: 2px solid var(--color-clay);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--color-muted);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(20, 20, 19, 0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(20, 20, 19, 0.28);
            border-radius: 3px;
        }

        @media (max-width: 820px) {
            :root {
                --ui-edge: 16px;
                --controls-reserve: 92px;
            }

            .header-panel {
                top: var(--ui-edge);
                left: var(--ui-edge);
                max-width: calc(100dvw - (var(--ui-edge) * 2));
            }

            .header-panel h1 {
                max-width: 280px;
            }

            .header-panel p {
                max-width: 280px;
                font-size: 13px;
            }

            .stats {
                max-width: min(300px, calc(100dvw - (var(--ui-edge) * 2)));
            }

            .controls-panel {
                left: var(--ui-edge);
                right: var(--ui-edge);
                bottom: var(--ui-edge);
            }

            .legend {
                right: var(--ui-edge);
                bottom: calc(var(--ui-edge) + var(--controls-reserve));
                max-width: 180px;
                max-height: 32dvh;
            }

            .info-panel {
                top: auto;
                left: var(--ui-edge);
                right: var(--ui-edge);
                bottom: calc(var(--ui-edge) + var(--controls-reserve));
                width: auto;
                max-height: min(56dvh, calc(100dvh - var(--controls-reserve) - (var(--ui-edge) * 3)));
            }

            body.info-open .header-panel,
            body.info-open .legend {
                display: none;
            }
        }

        @media (max-height: 620px) {
            .header-panel h1 {
                font-size: clamp(24px, 8vw, 38px);
            }

            .header-panel p {
                display: none;
            }

            .stats {
                margin-top: 10px;
            }

            .info-panel {
                top: var(--ui-edge);
                bottom: var(--ui-edge);
                max-height: none;
            }

            body.info-open .header-panel,
            body.info-open .legend {
                display: none;
            }
        }

        @media (max-width: 820px) and (max-height: 620px) {
            .info-panel {
                bottom: calc(var(--ui-edge) + var(--controls-reserve));
            }
        }

        @media (max-width: 540px) {
            .stat-card {
                padding: 6px 9px;
            }

            .info-panel {
                padding: 16px;
            }

            .data-row {
                flex-direction: column;
                gap: 4px;
            }

            .data-label {
                min-width: 0;
            }

            .data-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="globe"></canvas>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Initializing globe viewer...</div>
        </div>

        <div class="panel header-panel">
            <h1>Atlas Intel</h1>
            <p>Canonical country data, boundaries, airports, and capitals on a rotating global view.</p>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="countryCount">0</div>
                    <div class="stat-label">COUNTRIES</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="airportCount">0</div>
                    <div class="stat-label">AIRPORTS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="populationCount">0</div>
                    <div class="stat-label">TOTAL POPULATION</div>
                </div>
            </div>
        </div>

        <div class="panel info-panel" id="infoPanel">
            <!-- Country info will be inserted here -->
        </div>

        <div class="panel controls-panel">
            <button class="control-btn active" id="toggleBoundaries" onclick="toggleBoundaries()">
                Boundaries
            </button>
            <button class="control-btn active" id="toggleAirports" onclick="toggleAirports()">
                Airports
            </button>
            <button class="control-btn" id="loadAllAirports" onclick="loadAllAirports()">
                +21K Airports
            </button>
            <button class="control-btn active" id="toggleRotation" onclick="toggleRotation()">
                Rotate
            </button>
            <button class="control-btn icon-btn" id="zoomOut" onclick="zoomGlobe(1)" aria-label="Zoom out">-</button>
            <button class="control-btn icon-btn" id="zoomIn" onclick="zoomGlobe(-1)" aria-label="Zoom in">+</button>
        </div>

        <div class="panel legend">
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(20, 20, 19, 0.42); height: 2px; margin: 8px 0;"></div>
                <span>Boundary</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #6396d6; width: 7px; height: 7px; border-radius: 50%;"></div>
                <span>Airport</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgba(20, 20, 19, 0.36); width: 6px; height: 6px; border-radius: 50%;"></div>
                <span>Other Airport</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #6ea100; width: 9px; height: 9px; border-radius: 50%;"></div>
                <span>Capital</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
    <script src="globe.js?v=current-82458e3"></script>
</body>
</html>
